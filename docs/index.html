<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unspoken Cues</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F6F2EA; --ink: #1B1D22; --ink-soft: #5C6070; }
  @media (prefers-color-scheme: dark) { :root { --paper: #131211; --ink: #EDEAE4; --ink-soft: #A7A39B; } }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; }
  main { max-width: 400px; }
  .dots { display: flex; gap: 6px; margin-bottom: 20px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; }
  h1 { margin: 0 0 8px; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 36px; line-height: 44px; }
  p { margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <div class="dots" aria-hidden="true">
    <span style="background:#2E9E5B"></span><span style="background:#E8B517"></span><span style="background:#CF3A2D"></span><span style="background:#7B4FC9"></span>
  </div>
  <h1>Unspoken Cues</h1>
  <p>Let people know how you're doing, without saying a word.</p>
</main>
</body>
</html>
